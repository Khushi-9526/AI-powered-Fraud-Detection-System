# ===================================================================
# AI-Powered Fraud Detection System - Spring Boot 3.2.x Configuration
# ===================================================================

spring.application.name=fraud-detection-system
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (Default: Embedded In-Memory H2 Database)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:frauddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable H2 Database Web Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Alternative MySQL Configuration (Uncomment for Production MySQL)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/fraud_detection_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root123
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# -------------------------------------------------------------------
# Fraud ML Anomaly Engine Parameters
# -------------------------------------------------------------------
fraud.engine.version=4.2.0
fraud.engine.default-threshold-low=40
fraud.engine.default-threshold-high=75
fraud.engine.max-single-amount=10000.00
fraud.engine.velocity-limit-5min=4
fraud.engine.auto-block-above-score=85
fraud.engine.require-2fa-above-amount=3000.00
fraud.engine.model-name=Ensemble Isolation Forest + Random Forest v4.2

# -------------------------------------------------------------------
# Spring Security & JWT / TOTP Settings
# -------------------------------------------------------------------
security.jwt.secret=BankFraudSuperSecureJwtSecretKeyWith256BitsMinimumLength2026!
security.jwt.expiration-ms=86400000
security.totp.window-seconds=30
security.totp.time-step-size=30

# -------------------------------------------------------------------
# Actuator Management & JVM Health Telemetry
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
