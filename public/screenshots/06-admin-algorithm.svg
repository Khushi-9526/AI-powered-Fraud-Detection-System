<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="60" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="44" cy="30" r="12" fill="#4f46e5"/>
  <text x="66" y="35" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">AI-powered Fraud Detection System</text>
  <text x="860" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Logged in as: <tspan font-weight="700" fill="#4338ca">Security Officer (Admin)</tspan></text>
  <rect x="1100" y="16" width="70" height="28" rx="6" fill="#f1f5f9"/>
  <text x="1135" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Logout</text>
  
  <!-- Header & Tabs -->
  <g transform="translate(60, 80)">
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Algorithm Management &amp; Machine Learning Engine</text>
    <text x="0" y="46" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Model evaluation, Confusion Matrix metrics, and autonomous retraining loops</text>
    
    <rect x="0" y="65" width="540" height="40" rx="8" fill="#e2e8f0"/>
    <text x="92" y="89" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">⚙️ Configuration Settings</text>
    <text x="272" y="89" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">📊 Detection Reports</text>
    <rect x="360" y="69" width="176" height="32" rx="6" fill="#ffffff" filter="url(#shadow)"/>
    <text x="448" y="89" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle">🧠 Algorithm Management</text>
  </g>
  
  <!-- Top: Active Models Cards -->
  <g transform="translate(60, 195)">
    <!-- Model 1 (Active) -->
    <rect x="0" y="0" width="340" height="120" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
    <rect x="20" y="16" width="90" height="22" rx="11" fill="#e0e7ff"/>
    <text x="65" y="31" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#4338ca" text-anchor="middle">ACTIVE MODEL</text>
    <text x="20" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Random Forest Anomaly v4.2</text>
    <text x="20" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Accuracy: <tspan font-weight="700" fill="#0f172a">99.7%</tspan> • Precision: <tspan font-weight="700" fill="#0f172a">96.8%</tspan></text>
    <text x="20" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#10b981" font-weight="600">● Serving 100% of live production traffic</text>
    
    <!-- Model 2 -->
    <rect x="370" y="0" width="340" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="390" y="16" width="75" height="22" rx="11" fill="#f1f5f9"/>
    <text x="427" y="31" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">CHALLENGER</text>
    <text x="390" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Isolation Forest Unsupervised</text>
    <text x="390" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Accuracy: <tspan font-weight="700" fill="#0f172a">98.9%</tspan> • Zero-Day Catch: <tspan font-weight="700" fill="#0f172a">High</tspan></text>
    <text x="390" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Shadow testing on async pipeline</text>
    
    <!-- Model 3 -->
    <rect x="740" y="0" width="340" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="760" y="16" width="75" height="22" rx="11" fill="#f1f5f9"/>
    <text x="797" y="31" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">GRADIENT BOOST</text>
    <text x="760" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a">XGBoost Classifier v3.8</text>
    <text x="760" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Accuracy: <tspan font-weight="700" fill="#0f172a">99.4%</tspan> • Latency: <tspan font-weight="700" fill="#0f172a">18ms</tspan></text>
    <text x="760" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Trained on 500,000 historical vectors</text>
  </g>
  
  <!-- Middle: Confusion Matrix (Left) + Retraining Loop (Right) -->
  <g transform="translate(60, 335)">
    <!-- Confusion Matrix Box -->
    <rect width="600" height="300" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Model Confusion Matrix (Validation Dataset: 8,838 Tx)</text>
    <text x="24" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Detailed error analysis across positive fraud and legitimate classes</text>
    
    <g transform="translate(60, 75)">
      <!-- Top Labels -->
      <text x="180" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">PREDICTED FRAUD</text>
      <text x="360" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">PREDICTED LEGITIMATE</text>
      
      <!-- Row 1: Actual Fraud -->
      <text x="-40" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">ACTUAL FRAUD</text>
      
      <rect x="100" y="30" width="160" height="80" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="180" y="65" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#065f46" text-anchor="middle">428</text>
      <text x="180" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">TRUE POSITIVE (TP)</text>
      
      <rect x="280" y="30" width="160" height="80" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
      <text x="360" y="65" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#991b1b" text-anchor="middle">6</text>
      <text x="360" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">FALSE NEGATIVE (FN)</text>
      
      <!-- Row 2: Actual Legit -->
      <text x="-40" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">ACTUAL LEGIT</text>
      
      <rect x="100" y="120" width="160" height="80" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
      <text x="180" y="155" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#92400e" text-anchor="middle">14</text>
      <text x="180" y="178" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">FALSE POSITIVE (FP)</text>
      
      <rect x="280" y="120" width="160" height="80" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="360" y="155" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#065f46" text-anchor="middle">8,390</text>
      <text x="360" y="178" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">TRUE NEGATIVE (TN)</text>
    </g>
    
    <!-- Right Retraining Loop Card -->
    <g transform="translate(620, 0)">
      <rect width="460" height="300" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Continuous Feedback &amp; Retraining Loop</text>
      <text x="24" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Incorporate resolved verdicts to prevent model drift</text>
      
      <rect x="24" y="70" width="412" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="36" y="93" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">UNCOMMITTED USER RESOLUTIONS</text>
      <text x="36" y="113" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#4f46e5">18 Resolved Cases Ready for Ingestion</text>
      
      <rect x="24" y="140" width="412" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="36" y="163" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">ESTIMATED ACCURACY IMPROVEMENT</text>
      <text x="36" y="183" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#10b981">+0.14% Reduction in False Positives</text>
      
      <!-- Retrain Button -->
      <rect x="24" y="220" width="412" height="48" rx="10" fill="#4f46e5"/>
      <text x="230" y="250" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Trigger Model Retraining &amp; Auto-Deploy →</text>
    </g>
  </g>
</svg>
