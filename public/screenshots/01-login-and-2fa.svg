<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="48" cy="32" r="14" fill="#4f46e5"/>
  <path d="M42 32 L46 36 L54 28" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="74" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">AI-powered Fraud Detection System</text>
  
  <rect x="940" y="20" width="140" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="954" cy="33" r="4" fill="#10b981"/>
  <text x="966" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#047857">AI Fraud Shield: Active</text>
  
  <!-- Page Header -->
  <text x="600" y="115" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Enterprise Access Gateway</text>
  <text x="600" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Select your authorized role to access the fraud intelligence environment</text>
  
  <!-- Role Switcher Tabs -->
  <rect x="420" y="165" width="360" height="42" rx="10" fill="#e2e8f0"/>
  <rect x="424" y="169" width="176" height="34" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <text x="512" y="191" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">Client Financial Portal</text>
  <text x="692" y="191" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Admin Security Portal</text>
  
  <!-- Login Card (Centered) -->
  <g transform="translate(360, 225)">
    <rect width="480" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <!-- Portal Header inside card -->
    <rect x="24" y="24" width="40" height="40" rx="10" fill="#e0e7ff"/>
    <text x="36" y="49" font-family="system-ui, sans-serif" font-size="20" fill="#4f46e5">💳</text>
    <text x="76" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Client Financial Account</text>
    <text x="76" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Real-time balance, alert resolution &amp; fraud simulator</text>
    
    <!-- Input Field: Identifier -->
    <text x="24" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Account Identifier / Email</text>
    <rect x="24" y="106" width="432" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="132" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">alexander.wright@fintech.io</text>
    
    <!-- Auto-Detected Profile Badge -->
    <rect x="24" y="158" width="432" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <circle cx="44" cy="182" r="6" fill="#22c55e"/>
    <text x="60" y="177" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">Profile Auto-Detected: Alexander Wright</text>
    <text x="60" y="193" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Tier: Premier Private Banking • ACC: #AC-88420-US • Status: Active</text>
    
    <!-- 2FA / Google Authenticator Box -->
    <rect x="24" y="218" width="432" height="96" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="40" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7e22ce">🔐 Google Authenticator (TOTP Required)</text>
    <text x="370" y="242" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9333ea">⏱️ 24s</text>
    
    <!-- 6 OTP Boxes -->
    <g transform="translate(40, 255)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
      <text x="22" y="29" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#581c87" text-anchor="middle">4</text>
      
      <rect x="56" y="0" width="44" height="44" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
      <text x="78" y="29" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#581c87" text-anchor="middle">9</text>
      
      <rect x="112" y="0" width="44" height="44" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
      <text x="134" y="29" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#581c87" text-anchor="middle">2</text>
      
      <rect x="168" y="0" width="44" height="44" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
      <text x="190" y="29" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#581c87" text-anchor="middle">8</text>
      
      <rect x="224" y="0" width="44" height="44" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
      <text x="246" y="29" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#581c87" text-anchor="middle">1</text>
      
      <rect x="280" y="0" width="44" height="44" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
      <text x="302" y="29" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#581c87" text-anchor="middle">7</text>
    </g>
    
    <!-- Submit Button -->
    <rect x="24" y="326" width="432" height="44" rx="10" fill="#4f46e5"/>
    <text x="240" y="353" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Verify 2FA &amp; Enter Banking Portal →</text>
  </g>
</svg>
