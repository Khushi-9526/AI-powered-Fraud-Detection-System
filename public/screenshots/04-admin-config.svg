<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="60" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="44" cy="30" r="12" fill="#4f46e5"/>
  <text x="66" y="35" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">AI-powered Fraud Detection System</text>
  <text x="860" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Logged in as: <tspan font-weight="700" fill="#4338ca">Security Officer (Admin)</tspan></text>
  <rect x="1100" y="16" width="70" height="28" rx="6" fill="#f1f5f9"/>
  <text x="1135" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Logout</text>
  
  <!-- Admin Header & Tabs -->
  <g transform="translate(60, 80)">
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Admin Security Operations Console</text>
    <text x="0" y="46" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Enterprise threat calibration, automated defense rules and audit logs</text>
    
    <!-- Tab Pills -->
    <rect x="0" y="65" width="540" height="40" rx="8" fill="#e2e8f0"/>
    <rect x="4" y="69" width="176" height="32" rx="6" fill="#ffffff" filter="url(#shadow)"/>
    <text x="92" y="89" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle">⚙️ Configuration Settings</text>
    <text x="270" y="89" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">📊 Detection Reports</text>
    <text x="450" y="89" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">🧠 Algorithm Management</text>
  </g>
  
  <!-- Deployment Confirmation Banner -->
  <g transform="translate(60, 195)">
    <rect width="1080" height="60" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="36" cy="30" r="14" fill="#10b981"/>
    <path d="M30 30 L34 34 L42 26" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="64" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#065f46">Configuration Active &amp; Deployed (Version v2.4.1)</text>
    <text x="64" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#047857">Policy deployed across 4 payment gateways • Auto-block ceiling: 85 • Velocity: 5/hr • Geo-tolerance: 1,500km • Synced across all nodes</text>
    <rect x="940" y="16" width="120" height="28" rx="6" fill="#10b981"/>
    <text x="1000" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Audit Locked ✓</text>
  </g>
  
  <!-- Sliders Form Card -->
  <g transform="translate(60, 275)">
    <rect width="700" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Detection Threshold Controls</text>
    <text x="24" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Adjust risk sensitivity and autonomous blocking parameters</text>
    
    <!-- Slider 1: Auto Block -->
    <text x="24" y="90" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Autonomous Interception Ceiling (Auto-Block)</text>
    <text x="640" y="90" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#dc2626">85 / 100</text>
    <rect x="24" y="105" width="650" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="24" y="105" width="552" height="8" rx="4" fill="#ef4444"/>
    <circle cx="576" cy="109" r="10" fill="#ffffff" stroke="#ef4444" stroke-width="3"/>
    <text x="24" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Transactions with score ≥ 85 are immediately blocked and card temporarily suspended.</text>
    
    <!-- Slider 2: Manual Review -->
    <text x="24" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Suspicious Flagging Floor (Manual Review)</text>
    <text x="640" y="170" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#d97706">60 / 100</text>
    <rect x="24" y="185" width="650" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="24" y="185" width="390" height="8" rx="4" fill="#f59e0b"/>
    <circle cx="414" cy="189" r="10" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <text x="24" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Transactions between 60-84 are flagged for secondary 2FA or risk officer review.</text>
    
    <!-- Slider 3: Max Velocity -->
    <text x="24" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Transaction Velocity Limit (Tx per hour)</text>
    <text x="640" y="250" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#4f46e5">5 / hr</text>
    <rect x="24" y="265" width="650" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="24" y="265" width="325" height="8" rx="4" fill="#4f46e5"/>
    <circle cx="349" cy="269" r="10" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
    <text x="24" y="290" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Rapid card attempts exceeding this threshold trigger velocity burst flags.</text>
    
    <!-- Save & Deploy Button -->
    <rect x="24" y="305" width="240" height="40" rx="8" fill="#4f46e5"/>
    <text x="144" y="330" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Save &amp; Deploy Changes</text>
    
    <rect x="280" y="305" width="160" height="40" rx="8" fill="#f1f5f9"/>
    <text x="360" y="330" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Reset to Defaults</text>
  </g>
  
  <!-- Right Audit / Status Box -->
  <g transform="translate(780, 275)">
    <rect width="360" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Engine Deployment Status</text>
    
    <rect x="24" y="55" width="312" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">ACTIVE MODEL PIPELINE</text>
    <text x="36" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Hybrid RF + Isolation Forest v4.2</text>
    
    <rect x="24" y="125" width="312" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">LAST POLICY SYNC</text>
    <text x="36" y="168" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Today, 08:34 AM UTC (Verified)</text>
    
    <rect x="24" y="195" width="312" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="218" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">AVERAGE INFERENCE LATENCY</text>
    <text x="36" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#10b981">14.2 milliseconds / Tx</text>
    
    <rect x="24" y="270" width="312" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="36" y="294" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">SECURITY ADVISORY</text>
    <text x="36" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af">All threshold adjustments are recorded into immutable cryptographically verified audit trails.</text>
  </g>
</svg>
