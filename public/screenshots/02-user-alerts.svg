    <text x="390" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">Shield Protection Status</text>
    <text x="390" y="62" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#10b981">Secured &amp; Active</text>
    <text x="630" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">Auto-Block &gt; 85</text>
    
