      <text x="0" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Location: <tspan font-weight="700" fill="#0f172a">Singapore</tspan> • Channel: <tspan font-weight="700" fill="#0f172a">Card Swipe</tspan> • Time: <tspan font-weight="700" fill="#0f172a">14 minutes ago</tspan></text>
