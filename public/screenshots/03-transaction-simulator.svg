<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="60" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="44" cy="30" r="12" fill="#4f46e5"/>
  <text x="66" y="35" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">AI-powered Fraud Detection System</text>
  <text x="880" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Logged in as: <tspan font-weight="700" fill="#0f172a">Alexander Wright (User)</tspan></text>
  <rect x="1100" y="16" width="70" height="28" rx="6" fill="#f1f5f9"/>
  <text x="1135" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Logout</text>
  
  <!-- Title & Tabs -->
  <g transform="translate(60, 80)">
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Transaction Testing &amp; Fraud Simulator</text>
    <text x="0" y="46" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Simulate custom financial transactions and observe real-time AI ML risk scoring in action</text>
    
    <rect x="0" y="65" width="460" height="40" rx="8" fill="#e2e8f0"/>
    <text x="79" y="89" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">🚨 Transaction Alerts</text>
    <rect x="154" y="69" width="150" height="32" rx="6" fill="#ffffff" filter="url(#shadow)"/>
    <text x="229" y="89" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle">⚡ Test Simulator</text>
    <text x="382" y="89" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">📜 Ledger History</text>
  </g>
  
  <!-- Left Side: Simulator Form -->
  <g transform="translate(60, 205)">
    <rect width="520" height="430" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Input Transaction Parameters</text>
    <text x="24" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Configure payment attributes to test model boundaries</text>
    
    <!-- Quick Presets -->
    <text x="24" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">QUICK PRESET SCENARIOS:</text>
    <rect x="24" y="90" width="105" height="28" rx="6" fill="#f1f5f9"/>
    <text x="76" y="108" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Grocery ($42)</text>
    <rect x="135" y="90" width="125" height="28" rx="6" fill="#fee2e2"/>
    <text x="197" y="108" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Crypto ($4,999)</text>
    <rect x="266" y="90" width="125" height="28" rx="6" fill="#fef3c7"/>
    <text x="328" y="108" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Travel VPN ($850)</text>
    
    <!-- Form fields -->
    <text x="24" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Transaction Amount ($ USD)</text>
    <rect x="24" y="155" width="220" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="36" y="179" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">3,450.00</text>
    
    <text x="264" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Merchant Name</text>
    <rect x="264" y="155" width="232" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="276" y="179" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">BitPay Offshore Exchange</text>
    
    <text x="24" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Origin Country / IP Geolocation</text>
    <rect x="24" y="225" width="220" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="36" y="249" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">🇷🇺 Russia (High Geo-Drift)</text>
    
    <text x="264" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Payment Channel</text>
    <rect x="264" y="225" width="232" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="276" y="249" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">Online API Gateway</text>
    
    <!-- Velocity Counter -->
    <text x="24" y="285" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Rapid Transactions Burst Count (Last 10 min)</text>
    <rect x="24" y="295" width="472" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="36" y="319" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ef4444">6 transactions (Velocity Threshold Exceeded)</text>
    
    <!-- Submit Button -->
    <rect x="24" y="360" width="472" height="46" rx="10" fill="#4f46e5"/>
    <text x="260" y="388" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Run Real-Time AI Fraud Evaluation →</text>
  </g>
  
  <!-- Right Side: AI Risk Evaluation Result -->
  <g transform="translate(620, 205)">
    <rect width="520" height="430" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Real-Time Risk Scoring Output</text>
    <text x="24" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Evaluated across 4 ML anomaly vectors</text>
    
    <!-- Score Gauge Card -->
    <rect x="24" y="70" width="472" height="110" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <circle cx="80" cy="125" r="38" fill="#ffffff" stroke="#ef4444" stroke-width="6"/>
    <text x="80" y="132" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#dc2626" text-anchor="middle">91</text>
    <text x="140" y="105" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#991b1b">VERDICT: BLOCKED (High Fraud Risk)</text>
    <text x="140" y="128" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">Threshold: &gt; 85 Score Auto-Lock Triggered</text>
    <text x="140" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7f1d1d">Recommendation: Card balance frozen; SMS notification dispatched</text>
    
    <!-- Multi-Vector Breakdown -->
    <text x="24" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Anomaly Vector Decomposition:</text>
    
    <!-- Vector 1 -->
    <text x="24" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Geographic Drift Index</text>
    <text x="460" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">95%</text>
    <rect x="24" y="242" width="472" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="24" y="242" width="448" height="8" rx="4" fill="#ef4444"/>
    
    <!-- Vector 2 -->
    <text x="24" y="275" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Transaction Velocity Surge</text>
    <text x="460" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">88%</text>
    <rect x="24" y="282" width="472" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="24" y="282" width="415" height="8" rx="4" fill="#ef4444"/>
    
    <!-- Vector 3 -->
    <text x="24" y="315" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Amount Deviance from Baseline</text>
    <text x="460" y="315" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#d97706">74%</text>
    <rect x="24" y="322" width="472" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="24" y="322" width="349" height="8" rx="4" fill="#f59e0b"/>
    
    <!-- Vector 4 -->
    <text x="24" y="355" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Merchant Risk Category Factor</text>
    <text x="460" y="355" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">90%</text>
    <rect x="24" y="362" width="472" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="24" y="362" width="424" height="8" rx="4" fill="#ef4444"/>
    
    <text x="24" y="398" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Latency: 14ms • Decision Engine: Random Forest + Isolation Forest Hybrid</text>
  </g>
</svg>
